roles = [
    "domain-sea.fudo.org",
    "kubernetes-seattle",
    "site-seattle",
    "wallfly-seattle",
]

[[ssh-host-keys]]
source = "ssh/ssh_host_ecdsa_key.age"
target = "ssh_host_ecdsa_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ecdsa"

[[ssh-host-keys]]
source = "ssh/ssh_host_ed25519_key.age"
target = "ssh_host_ed25519_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ed25519"

[keytab]
source = "keytab.age"
target = "/run/aegis/keytab"
user = "root"
group = "root"
mode = "0600"

[nexus-key]
source = "nexus-key.age"
target = "/run/aegis/nexus-key"
user = "root"
group = "root"
mode = "0400"
type = "ed25519"

[secrets.deploy-ed25519-key]
source = "ssh/deploy_ed25519_key.age"
target = "/run/aegis/ssh/deploy_ed25519_key"
user = "root"
group = "root"
mode = "0600"

[secrets.initrd-ed25519-key]
source = "ssh/initrd_ed25519_key.age"
target = "/run/aegis/ssh/initrd_ed25519_key"
user = "root"
group = "root"
mode = "0600"

[secrets."gpu-node-tagger.ca-crt"]
source = "../../roles/kubernetes-seattle/secrets/gpu-node-tagger.ca-crt.age"
target = "/run/gpu-node-tagger/ca.crt"
user = "root"
group = "root"
mode = "0400"
role = "kubernetes-seattle"

[secrets."gpu-node-tagger.token"]
source = "../../roles/kubernetes-seattle/secrets/gpu-node-tagger.token.age"
target = "/run/gpu-node-tagger/token"
user = "root"
group = "root"
mode = "0400"
role = "kubernetes-seattle"

[secrets.wallfly-hermes-passwd]
source = "../../roles/wallfly-seattle/secrets/wallfly-hermes-passwd.age"
target = "/run/wallfly-hermes/passwd"
user = "hermes"
group = "root"
mode = "0400"
role = "wallfly-seattle"

