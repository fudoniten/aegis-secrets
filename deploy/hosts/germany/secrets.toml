roles = [
    "domain-fudo.org",
    "mail-server-fudo",
    "matrix-server-fudo",
    "site-portage",
]

[[ssh-host-keys]]
source = "ssh/ssh_host_ecdsa_key.age"
target = "ssh_host_ecdsa_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ecdsa"

[[ssh-host-keys]]
source = "ssh/ssh_host_ed25519_key.age"
target = "ssh_host_ed25519_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ed25519"

[keytab]
source = "keytab.age"
target = "/run/aegis/keytab"
user = "root"
group = "root"
mode = "0600"

[nexus-key]
source = "nexus-key.age"
target = "/run/aegis/nexus-key"
user = "root"
group = "root"
mode = "0400"
type = "ed25519"

[secrets.nebula-fudo-cert]
source = "nebula/fudo.crt.age"
target = "/run/aegis/nebula/fudo.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-ca]
source = "nebula/fudo-ca.crt.age"
target = "/run/aegis/nebula/fudo-ca.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-key]
source = "nebula/fudo.key.age"
target = "/run/aegis/nebula/fudo.key"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0400"

[secrets."paris-outpost.token"]
source = "secrets/paris-outpost.token.age"
target = "/run/paris/outpost.token"
user = "root"
group = "root"
mode = "0400"

[secrets."paris-bind.token"]
source = "secrets/paris-bind.token.age"
target = "/run/paris/bind.token"
user = "root"
group = "root"
mode = "0400"

[secrets."mastodon-oidc.env"]
source = "secrets/mastodon-oidc.env.age"
target = "/run/mastodon/oidc.env"
user = "root"
group = "root"
mode = "0400"

[secrets."mail-outpost.token"]
source = "../../roles/mail-server-fudo/secrets/mail-outpost.token.age"
target = "/run/mail-server/outpost.token"
user = "root"
group = "root"
mode = "0400"
role = "mail-server-fudo"

[secrets."ldap-bind.passwd"]
source = "../../roles/mail-server-fudo/secrets/ldap-bind.passwd.age"
target = "/run/mail-server/ldap-bind.passwd"
user = "root"
group = "root"
mode = "0400"
role = "mail-server-fudo"

[secrets."mail-redis.passwd"]
source = "../../roles/mail-server-fudo/secrets/mail-redis.passwd.age"
target = "/run/mail-server/redis.passwd"
user = "root"
group = "root"
mode = "0400"
role = "mail-server-fudo"

[secrets."dovecot-admin.passwd"]
source = "../../roles/mail-server-fudo/secrets/dovecot-admin.passwd.age"
target = "/run/mail-server/dovecot-admin.passwd"
user = "root"
group = "root"
mode = "0400"
role = "mail-server-fudo"

[secrets."matrix-jwt.pem"]
source = "../../roles/matrix-server-fudo/secrets/matrix-jwt.pem.age"
target = "/run/matrix/jwt.pem"
user = "matrix-synapse"
group = "root"
mode = "0400"
role = "matrix-server-fudo"

[secrets."matrix-oidc.secret"]
source = "../../roles/matrix-server-fudo/secrets/matrix-oidc.secret.age"
target = "/run/matrix/oidc-client.secret"
user = "root"
group = "root"
mode = "0400"
role = "matrix-server-fudo"
