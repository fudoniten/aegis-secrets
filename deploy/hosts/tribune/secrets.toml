roles = [
    "domain-fudo.org",
    "fudo-notify-fudo.org",
    "site-worldstream2",
]

[[ssh-host-keys]]
source = "ssh/ssh_host_ed25519_key.age"
target = "ssh_host_ed25519_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ed25519"

[[ssh-host-keys]]
source = "ssh/ssh_host_ecdsa_key.age"
target = "ssh_host_ecdsa_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ecdsa"

[keytab]
source = "keytab.age"
target = "/run/aegis/keytab"
user = "root"
group = "root"
mode = "0600"

[nexus-key]
source = "nexus-key.age"
target = "/run/aegis/nexus-key"
user = "root"
group = "root"
mode = "0400"
type = "ed25519"

[secrets.deploy-ed25519-key]
source = "ssh/deploy_ed25519_key.age"
target = "/run/aegis/ssh/deploy_ed25519_key"
user = "root"
group = "root"
mode = "0600"

[secrets.initrd-ed25519-key]
source = "ssh/initrd_ed25519_key.age"
target = "/run/aegis/ssh/initrd_ed25519_key"
user = "root"
group = "root"
mode = "0600"

[secrets."fudo.org.ntfy-topic"]
source = "../../roles/fudo-notify-fudo.org/secrets/fudo.org.ntfy-topic.age"
target = "/run/fudo-notify/topic"
user = "root"
group = "fudo-notify"
mode = "0440"
role = "fudo-notify-fudo.org"
