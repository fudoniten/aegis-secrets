roles = [
    "authentik-fudo",
    "domain-fudo.org",
    "fudo-notify-fudo.org",
    "nexus-server",
    "site-worldstream2",
]

[[ssh-host-keys]]
source = "ssh/ssh_host_ed25519_key.age"
target = "ssh_host_ed25519_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ed25519"

[[ssh-host-keys]]
source = "ssh/ssh_host_ecdsa_key.age"
target = "ssh_host_ecdsa_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ecdsa"

[keytab]
source = "keytab.age"
target = "/run/aegis/keytab"
user = "root"
group = "root"
mode = "0600"

[nexus-key]
source = "nexus-key.age"
target = "/run/aegis/nexus-key"
user = "root"
group = "root"
mode = "0400"
type = "ed25519"

[secrets.deploy-ed25519-key]
source = "ssh/deploy_ed25519_key.age"
target = "/run/aegis/ssh/deploy_ed25519_key"
user = "root"
group = "root"
mode = "0600"

[secrets.initrd-ed25519-key]
source = "ssh/initrd_ed25519_key.age"
target = "/run/aegis/ssh/initrd_ed25519_key"
user = "root"
group = "root"
mode = "0600"

[secrets."fudo.org.ntfy-topic"]
source = "../../roles/fudo-notify-fudo.org/secrets/fudo.org.ntfy-topic.age"
target = "/run/fudo-notify/topic"
user = "root"
group = "fudo-notify"
mode = "0440"
role = "fudo-notify-fudo.org"

[secrets.nexus-server-db-passwd]
source = "../../roles/nexus-server/secrets/nexus-server-db-passwd.age"
target = "/run/nexus/server-db.passwd"
user = "root"
group = "root"
mode = "0400"
role = "nexus-server"

[secrets.nexus-server-db-passwd-postgres]
source = "../../roles/nexus-server/secrets/nexus-server-db-passwd-postgres.age"
target = "/run/nexus-postgres/server-db.passwd"
user = "postgres"
group = "postgres"
mode = "0400"
role = "nexus-server"

[secrets.nexus-dns-db-passwd]
source = "../../roles/nexus-server/secrets/nexus-dns-db-passwd.age"
target = "/run/nexus/dns-server-db.passwd"
user = "root"
group = "root"
mode = "0400"
role = "nexus-server"

[secrets.nexus-dns-db-passwd-postgres]
source = "../../roles/nexus-server/secrets/nexus-dns-db-passwd-postgres.age"
target = "/run/nexus-postgres/dns-server-db.passwd"
user = "postgres"
group = "postgres"
mode = "0400"
role = "nexus-server"

[secrets.nebula-fudo-cert]
source = "nebula/fudo.crt.age"
target = "/run/aegis/nebula/fudo.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-ca]
source = "nebula/fudo-ca.crt.age"
target = "/run/aegis/nebula/fudo-ca.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-key]
source = "nebula/fudo.key.age"
target = "/run/aegis/nebula/fudo.key"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0400"

[secrets."authentik-postgres.passwd"]
source = "../../roles/authentik-fudo/secrets/authentik-postgres.passwd.age"
target = "/run/authentik/postgres.passwd"
user = "root"
group = "root"
mode = "0400"
role = "authentik-fudo"

[secrets."authentik-secret.key"]
source = "../../roles/authentik-fudo/secrets/authentik-secret.key.age"
target = "/run/authentik/secret.key"
user = "root"
group = "root"
mode = "0400"
role = "authentik-fudo"

[secrets."authentik-smtp.passwd"]
source = "../../roles/authentik-fudo/secrets/authentik-smtp.passwd.age"
target = "/run/authentik/smtp.passwd"
user = "root"
group = "root"
mode = "0400"
role = "authentik-fudo"

# Lemmy revival: DB password and the connection URL built from it, both
# encrypted to this host's age key. The postgres module uses the password
# to create/set the `lemmy` role; the lemmy module loads the URL via
# LoadCredential (database.uriFile).
[secrets.lemmy-db-passwd]
source = "lemmy-db-passwd.age"
target = "/run/aegis/lemmy-db-passwd"
user = "root"
group = "root"
mode = "0400"

[secrets.lemmy-db-url]
source = "lemmy-db-url.age"
target = "/run/aegis/lemmy-db-url"
user = "root"
group = "root"
mode = "0400"
