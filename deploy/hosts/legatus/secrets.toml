roles = [
    "domain-fudo.org",
    "site-worldstream",
]

[[ssh-host-keys]]
source = "ssh/ssh_host_ecdsa_key.age"
target = "ssh_host_ecdsa_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ecdsa"

[[ssh-host-keys]]
source = "ssh/ssh_host_ed25519_key.age"
target = "ssh_host_ed25519_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ed25519"

[[ssh-host-keys]]
source = "ssh/ssh_host_rsa_key.age"
target = "ssh_host_rsa_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "rsa"

[keytab]
source = "keytab.age"
target = "/run/aegis/keytab"
user = "root"
group = "root"
mode = "0600"

[nexus-key]
source = "nexus-key.age"
target = "/run/aegis/nexus-key"
user = "root"
group = "root"
mode = "0400"
type = "ed25519"

[secrets.nebula-fudo-cert]
source = "nebula/fudo.crt.age"
target = "/run/aegis/nebula/fudo.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-ca]
source = "nebula/fudo-ca.crt.age"
target = "/run/aegis/nebula/fudo-ca.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-key]
source = "nebula/fudo.key.age"
target = "/run/aegis/nebula/fudo.key"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0400"

[secrets.nexus-server-db-passwd]
source = "secrets/nexus-server-db-passwd.age"
target = "/run/nexus/server-db.passwd"
user = "root"
group = "root"
mode = "0400"

[secrets.nexus-server-db-passwd-postgres]
source = "secrets/nexus-server-db-passwd-postgres.age"
target = "/run/nexus-postgres/server-db.passwd"
user = "postgres"
group = "postgres"
mode = "0400"

[secrets.nexus-dns-db-passwd]
source = "secrets/nexus-dns-db-passwd.age"
target = "/run/nexus/dns-server-db.passwd"
user = "root"
group = "root"
mode = "0400"

[secrets.nexus-dns-db-passwd-postgres]
source = "secrets/nexus-dns-db-passwd-postgres.age"
target = "/run/nexus-postgres/dns-server-db.passwd"
user = "postgres"
group = "postgres"
mode = "0400"
