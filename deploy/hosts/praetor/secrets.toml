roles = [
    "domain-fudo.org",
    "fudo-notify-fudo.org",
    "fudo-ntfy",
    "site-hetzner0",
]

[[ssh-host-keys]]
source = "ssh/ssh_host_ecdsa_key.age"
target = "ssh_host_ecdsa_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ecdsa"

[[ssh-host-keys]]
source = "ssh/ssh_host_ed25519_key.age"
target = "ssh_host_ed25519_key"
target_dir = "/run/aegis/ssh"
user = "root"
group = "root"
mode = "0600"
type = "ed25519"

[keytab]
source = "keytab.age"
target = "/run/aegis/keytab"
user = "root"
group = "root"
mode = "0600"

[nexus-key]
source = "nexus-key.age"
target = "/run/aegis/nexus-key"
user = "root"
group = "root"
mode = "0400"
type = "ed25519"

[secrets.nebula-fudo-cert]
source = "nebula/fudo.crt.age"
target = "/run/aegis/nebula/fudo.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-ca]
source = "nebula/fudo-ca.crt.age"
target = "/run/aegis/nebula/fudo-ca.crt"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0444"

[secrets.nebula-fudo-key]
source = "nebula/fudo.key.age"
target = "/run/aegis/nebula/fudo.key"
user = "nebula-fudo"
group = "nebula-fudo"
mode = "0400"

[secrets."fudo.org.ntfy-topic"]
source = "../../roles/fudo-notify-fudo.org/secrets/fudo.org.ntfy-topic.age"
target = "/run/fudo-notify/topic"
user = "root"
group = "fudo-notify"
mode = "0440"
role = "fudo-notify-fudo.org"

[secrets.ntfy-admin-password]
source = "../../roles/fudo-ntfy/secrets/ntfy-admin-password.age"
target = "/run/aegis/ntfy/admin-password"
user = "root"
group = "root"
mode = "0400"
role = "fudo-ntfy"

[secrets."ntfy-server.env"]
source = "../../roles/fudo-ntfy/secrets/ntfy-server.env.age"
target = "/run/aegis/ntfy/server.env"
user = "root"
group = "root"
mode = "0400"
role = "fudo-ntfy"
